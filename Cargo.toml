[package]
name = "myanbet365"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "form", "json", "query"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
minijinja = { version = "3.0.0", features = ["serde", "json", "unicode"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
tokio = { version = "1.53.2", features = ["full"] }
