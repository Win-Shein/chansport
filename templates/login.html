<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MYANBET365</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#101726] text-slate-200 font-sans min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-400 selection:text-slate-900">

  <div class="w-full max-w-md bg-[#16213e] border border-[#233554] rounded-xl shadow-2xl overflow-hidden">

    <!-- Header Strip -->
    <div class="bg-[#0f3460] px-6 py-5 border-b border-[#1f4068] text-center">
      <div class="flex items-center justify-center space-x-2">
        <span class="font-black text-2xl tracking-widest text-amber-400">MYANBET<span class="text-white">365</span></span>
      </div>
    </div>

    <!-- Login Body -->
    <div class="p-6 sm:p-8 space-y-5">

      {% if error %}
        <div class="p-3.5 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs sm:text-sm flex items-center space-x-2 font-medium">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-400"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4">

        <!-- Username Field -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center space-x-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Username</span>
          </label>
          <input
            type="text"
            name="username"
            placeholder="Username"
            required
            autocomplete="username"
            class="w-full px-3.5 py-2.5 bg-[#0d1527] border border-[#233554] rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center space-x-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Password</span>
          </label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 bg-[#0d1527] border border-[#233554] rounded-lg text-white text-sm placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
          >
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button
            type="submit"
            class="w-full py-3 bg-[#0f3460] hover:bg-[#1a4a84] border border-[#1f4068] hover:border-amber-400/50 text-amber-300 hover:text-amber-200 font-black text-sm uppercase tracking-wider rounded-lg transition duration-150 shadow-md flex items-center justify-center space-x-2"
          >
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>Sign In</span>
          </button>
        </div>

      </form>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
