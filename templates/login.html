<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chan Sport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0b2545] text-slate-200 font-sans min-h-screen flex items-center justify-center p-4 pb-16 antialiased">

  <div class="w-full max-w-md bg-[#0f2f57] border border-[#1b4a73] rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header Strip -->
    <div class="bg-[#081a33] px-6 py-7 border-b border-[#1b4a73] text-center">
      <div class="flex items-center justify-center space-x-1">
        <span class="font-black text-3xl tracking-wide text-amber-400">CHAN<span class="text-white">SPORT</span></span>
      </div>
      <div class="mt-1 text-[11px] uppercase tracking-widest text-slate-400 font-semibold">Admin Console</div>
    </div>

    <!-- Login Body -->
    <div class="p-6 sm:p-8 space-y-5">

      {% if error %}
        <div class="p-3.5 rounded-lg bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs sm:text-sm flex items-center space-x-2 font-medium">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-400"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center space-x-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Username</span>
          </label>
          <input type="text" name="username" placeholder="Username" required autocomplete="username"
            class="w-full px-3.5 py-3 bg-[#081a33] border border-[#1b4a73] rounded-lg text-white text-base placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5 flex items-center space-x-1.5">
            <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Password</span>
          </label>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"
            class="w-full px-3.5 py-3 bg-[#081a33] border border-[#1b4a73] rounded-lg text-white text-base placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition">
        </div>

        <div class="pt-2">
          <button type="submit"
            class="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-sm uppercase tracking-wider rounded-lg transition duration-150 shadow-md flex items-center justify-center space-x-2">
            <i data-lucide="log-in" class="w-4 h-4"></i>
            <span>Sign In</span>
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>lucide.createIcons();</script>

  <footer class="fixed bottom-0 inset-x-0 z-30 bg-[#081a33] border-t border-[#1b4a73] text-center text-[11px] font-semibold text-slate-300 py-2">
    <span class="text-amber-400/80">✦</span>
    Built by <span class="text-amber-400 font-bold tracking-wide">MMXERON</span>
    <span class="text-slate-400">· for the love of the beautiful game</span>
    <span class="text-amber-400/80">✦</span>
  </footer>
</body>
</html>
