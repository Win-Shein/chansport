<!-- App Header -->
<header class="sticky top-0 z-40 bg-[#0b2545] text-white border-b-2 border-amber-400 shadow">
  <div class="mx-auto max-w-3xl h-14 px-3 flex items-center justify-between gap-2">
    <a href="/home" class="font-black tracking-wide text-base sm:text-lg text-amber-400 shrink-0">CHAN<span class="text-white">SPORT</span></a>
    <div class="flex-1 text-center min-w-0">
      <div id="clock" class="text-[10px] sm:text-[11px] font-mono text-amber-300 leading-tight">--</div>
    </div>
    <div class="flex items-center space-x-1.5 shrink-0">
      <span class="hidden sm:inline text-[11px] text-slate-300 max-w-[90px] truncate">{{ admin.username }}</span>
      <button type="button" onclick="openChangePasswordModal()" class="p-2 rounded-lg bg-[#133b5c] border border-blue-800/60 active:bg-[#1b4a73]" title="Change Password">
        <i data-lucide="key" class="w-4 h-4"></i>
      </button>
      <a href="/logout" class="p-2 rounded-lg bg-rose-700 active:bg-rose-800" title="Logout">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </a>
    </div>
  </div>
</header>

<!-- ================= CHANGE PASSWORD MODAL ================= -->
<div id="changePasswordModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
  <div class="bg-white rounded-t-2xl sm:rounded-xl shadow-2xl w-full sm:max-w-sm border border-slate-300 overflow-hidden text-slate-800 text-sm">
    <div class="bg-[#0b2545] text-white px-5 py-3 flex justify-between items-center font-bold">
      <span class="flex items-center space-x-2"><i data-lucide="key" class="w-4 h-4 text-amber-400"></i><span>Change Password</span></span>
      <button type="button" onclick="closeChangePasswordModal()" class="text-slate-300 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <form id="changePasswordForm" onsubmit="return handleChangePasswordSubmit(event)" class="p-5 space-y-3.5">
      <div id="changePasswordAlert" class="hidden bg-rose-50 border border-rose-300 text-rose-700 text-xs font-semibold rounded px-3 py-2"></div>
      <div id="changePasswordSuccess" class="hidden bg-emerald-50 border border-emerald-300 text-emerald-700 text-xs font-semibold rounded px-3 py-2"></div>
      <div>
        <label class="block font-bold text-slate-700 mb-1 text-xs">Current Password</label>
        <input type="password" name="current_password" required class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:border-blue-600 focus:outline-none">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1 text-xs">New Password</label>
        <input type="password" name="new_password" required minlength="6" placeholder="At least 6 characters" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:border-blue-600 focus:outline-none">
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1 text-xs">Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="6" class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:border-blue-600 focus:outline-none">
      </div>
      <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-200">
        <button type="button" onclick="closeChangePasswordModal()" class="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-lg text-xs">Cancel</button>
        <button type="submit" id="btnChangePassword" class="px-5 py-2.5 bg-[#0b2545] hover:bg-[#133b5c] text-amber-300 font-bold rounded-lg text-xs shadow">Update</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Live Myanmar (UTC+6:30) clock
  function updateClock() {
    const el = document.getElementById('clock');
    if (!el) return;
    const myanmar = new Date(Date.now() + (6 * 60 + 30) * 60000);
    const p = (n) => String(n).padStart(2, '0');
    el.textContent = myanmar.getUTCFullYear() + '-' + p(myanmar.getUTCMonth() + 1) + '-' + p(myanmar.getUTCDate())
      + ' ' + p(myanmar.getUTCHours()) + ':' + p(myanmar.getUTCMinutes()) + ':' + p(myanmar.getUTCSeconds());
  }
  setInterval(updateClock, 1000);
  updateClock();

  function openChangePasswordModal() {
    const form = document.getElementById('changePasswordForm');
    form.reset();
    document.getElementById('changePasswordAlert').classList.add('hidden');
    document.getElementById('changePasswordSuccess').classList.add('hidden');
    document.getElementById('changePasswordModal').classList.remove('hidden');
  }
  function closeChangePasswordModal() { document.getElementById('changePasswordModal').classList.add('hidden'); }
  function showChangePasswordAlert(msg) { const b = document.getElementById('changePasswordAlert'); b.textContent = msg; b.classList.remove('hidden'); }
  function showChangePasswordSuccess(msg) { const b = document.getElementById('changePasswordSuccess'); b.textContent = msg; b.classList.remove('hidden'); }
  async function handleChangePasswordSubmit(event) {
    event.preventDefault();
    document.getElementById('changePasswordAlert').classList.add('hidden');
    document.getElementById('changePasswordSuccess').classList.add('hidden');
    const form = event.target;
    if (form.new_password.value !== form.confirm_password.value) {
      showChangePasswordAlert('New password and confirm password do not match.');
      return false;
    }
    const btn = document.getElementById('btnChangePassword');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      const response = await fetch('/admin/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current_password: form.current_password.value, new_password: form.new_password.value })
      });
      const data = await response.json();
      if (response.ok && data.success) {
        showChangePasswordSuccess(data.message || 'Password updated successfully.');
        form.reset();
      } else {
        showChangePasswordAlert(data.message || 'Failed to update password.');
      }
    } catch (err) {
      showChangePasswordAlert('Network error. Please try again.');
    }
    btn.disabled = false; btn.textContent = label;
    return false;
  }
</script>

<!-- Fixed footer -->
<footer class="fixed bottom-0 inset-x-0 z-30 bg-[#0b2545] border-t border-[#1b4a73] text-center text-[11px] font-semibold text-slate-300 py-2 shadow">
  Built by <span class="text-amber-400 font-bold">MMXERON</span>
</footer>
